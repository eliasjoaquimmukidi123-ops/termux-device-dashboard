<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Diagnóstico · Device Monitor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230A0E14%22/><circle cx=%2250%22 cy=%2250%22 r=%2226%22 fill=%22none%22 stroke=%22%2322D3C7%22 stroke-width=%228%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E14;
    --surface:#121924;
    --surface-2:#0E141D;
    --line:#212A37;
    --text:#E7ECF2;
    --text-dim:#7C8A9C;
    --ok:#22D3C7;
    --warn:#FFB454;
    --crit:#FF5C7A;
    --brand:#7B6CFF;
    --ring-track:#1B2431;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:
      radial-gradient(circle at 15% -10%, rgba(123,108,255,0.16), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(34,211,199,0.10), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    min-height:100vh;
  }
  body{ padding:18px 14px 40px; }

  /* ---------- Header: terminal prompt style ---------- */
  header{ margin-bottom:22px; }
  .prompt{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    color:var(--ok);
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:10px;
  }
  .prompt .path{ color:var(--brand); }
  .cursor{
    display:inline-block;
    width:7px; height:14px;
    background:var(--ok);
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.55rem;
    line-height:1.2;
    letter-spacing:-0.01em;
  }
  h1 span{ color:var(--ok); }

  #status-line{
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    color:var(--text-dim);
    margin-top:8px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .live-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 0 0 rgba(34,211,199,0.6);
    animation:pulse 2s infinite;
    flex-shrink:0;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(34,211,199,0.55); }
    70%{ box-shadow:0 0 0 8px rgba(34,211,199,0); }
    100%{ box-shadow:0 0 0 0 rgba(34,211,199,0); }
  }

  /* ---------- Grid & cards ---------- */
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    max-width:480px;
    margin:0 auto;
  }
  .card{
    background:linear-gradient(180deg, var(--surface), var(--surface-2));
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px 18px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .card-label{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:0.95rem;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:0.62rem;
    color:var(--text-dim);
    border:1px solid var(--line);
    border-radius:20px;
    padding:2px 8px;
    letter-spacing:0.04em;
  }

  /* ---------- Ring gauge (bateria / armazenamento) ---------- */
  .gauge-row{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .ring-wrap{ position:relative; width:96px; height:96px; flex-shrink:0; }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--ring-track); stroke-width:9; }
  .ring-fill{
    fill:none; stroke-width:9; stroke-linecap:round;
    transition:stroke-dashoffset 0.8s cubic-bezier(.4,0,.2,1), stroke 0.5s;
  }
  .ring-value{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:1.05rem;
  }
  .details{
    list-style:none;
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    color:var(--text-dim);
    flex:1;
    min-width:0;
  }
  .details li{
    display:flex; justify-content:space-between; gap:10px;
    padding:3px 0;
    border-bottom:1px dashed var(--line);
  }
  .details li:last-child{ border-bottom:none; }
  .details span:last-child{ color:var(--text); text-align:right; }

  /* ---------- Signal bars (Wi-Fi) ---------- */
  .signal-row{ display:flex; align-items:flex-end; gap:18px; }
  .bars{ display:flex; align-items:flex-end; gap:4px; height:52px; flex-shrink:0; }
  .bars .bar{
    width:11px;
    background:var(--ring-track);
    border-radius:3px;
    transition:background 0.5s;
  }
  .bars .bar:nth-child(1){ height:20%; }
  .bars .bar:nth-child(2){ height:40%; }
  .bars .bar:nth-child(3){ height:60%; }
  .bars .bar:nth-child(4){ height:80%; }
  .bars .bar:nth-child(5){ height:100%; }
  .bar.on{ background:var(--ok); }

  .ssid-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    margin-bottom:2px;
    word-break:break-word;
  }

  .error-text{ color:var(--crit); font-family:'JetBrains Mono', monospace; font-size:0.72rem; }

  footer{
    max-width:480px;
    margin:26px auto 0;
    font-family:'JetBrains Mono', monospace;
    font-size:0.65rem;
    color:var(--text-dim);
    text-align:center;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
</style>
</head>
<body>

  <header>
    <div class="prompt"><span class="path">root@device</span>:~$ monitor --live<span class="cursor"></span></div>
    <h1>Painel de <span>Diagnóstico</span></h1>
    <div id="status-line"><span class="live-dot"></span><span id="last-update">a sincronizar…</span></div>
  </header>

  <main class="grid">

    <section class="card" id="card-battery">
      <div class="card-head">
        <div class="card-label">🔋 Bateria</div>
        <div class="tag" id="battery-status">--</div>
      </div>
      <div class="gauge-row">
        <div class="ring-wrap">
          <svg viewBox="0 0 100 100">
            <circle class="ring-track" cx="50" cy="50" r="42"></circle>
            <circle class="ring-fill" id="battery-ring" cx="50" cy="50" r="42"
              stroke-dasharray="264" stroke-dashoffset="264" stroke="#22D3C7"></circle>
          </svg>
          <div class="ring-value" id="battery-percentage">--%</div>
        </div>
        <ul class="details" id="battery-details">
          <li><span>Corrente</span><span>--</span></li>
          <li><span>Temp.</span><span>--</span></li>
          <li><span>Saúde</span><span>--</span></li>
        </ul>
      </div>
    </section>

    <section class="card" id="card-network">
      <div class="card-head">
        <div class="card-label">📶 Rede Wi-Fi</div>
        <div class="tag" id="network-status">--</div>
      </div>
      <div class="signal-row">
        <div class="bars" id="signal-bars">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div>
        </div>
        <div style="flex:1; min-width:0;">
          <div class="ssid-name" id="network-ssid">--</div>
          <ul class="details" id="network-details">
            <li><span>Sinal</span><span>--</span></li>
            <li><span>Veloc.</span><span>--</span></li>
            <li><span>IP</span><span>--</span></li>
          </ul>
        </div>
      </div>
    </section>

    <section class="card" id="card-storage">
      <div class="card-head">
        <div class="card-label">💾 Armazenamento</div>
        <div class="tag" id="storage-status">--</div>
      </div>
      <div class="gauge-row">
        <div class="ring-wrap">
          <svg viewBox="0 0 100 100">
            <circle class="ring-track" cx="50" cy="50" r="42"></circle>
            <circle class="ring-fill" id="storage-ring" cx="50" cy="50" r="42"
              stroke-dasharray="264" stroke-dashoffset="264" stroke="#22D3C7"></circle>
          </svg>
          <div class="ring-value" id="storage-percentage">--%</div>
        </div>
        <ul class="details" id="storage-details">
          <li><span>Usado</span><span>--</span></li>
          <li><span>Livre</span><span>--</span></li>
          <li><span>Total</span><span>--</span></li>
        </ul>
      </div>
    </section>

  </main>

  <footer>
    $ watching battery · wifi · storage — refresh interval: 5s
  </footer>

<script>
const REFRESH_MS = 5000;
const CIRC = 2 * Math.PI * 42; // 263.9...

function colorFor(pct, invert){
  const bad = invert ? pct > 85 : pct < 20;
  const warn = invert ? pct > 65 : pct < 50;
  if (bad) return getCssVar('--crit');
  if (warn) return getCssVar('--warn');
  return getCssVar('--ok');
}
function getCssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function setRing(ringEl, pct, invert){
  const offset = CIRC - (Math.max(0, Math.min(100, pct)) / 100) * CIRC;
  ringEl.style.strokeDasharray = CIRC;
  ringEl.style.strokeDashoffset = offset;
  ringEl.style.stroke = colorFor(pct, invert);
}

function renderBattery(data){
  const ring = document.getElementById("battery-ring");
  const pctEl = document.getElementById("battery-percentage");
  const details = document.getElementById("battery-details");
  const status = document.getElementById("battery-status");

  if (!data || data.error){
    pctEl.textContent = "N/D";
    status.textContent = "offline";
    details.innerHTML = `<li class="error-text">${data?.error || "sem dados"}</li>`;
    setRing(ring, 0, false);
    return;
  }
  const pct = data.percentage ?? 0;
  setRing(ring, pct, false);
  pctEl.textContent = `${pct}%`;
  status.textContent = data.status === "CHARGING" ? "a carregar" : "descarga";
  details.innerHTML = `
    <li><span>Corrente</span><span>${data.plugged || "-"}</span></li>
    <li><span>Temp.</span><span>${data.temperature ?? "-"}°C</span></li>
    <li><span>Saúde</span><span>${data.health || "-"}</span></li>
  `;
}

function rssiToBars(rssi){
  if (rssi === undefined || rssi === null) return 0;
  if (rssi >= -55) return 5;
  if (rssi >= -65) return 4;
  if (rssi >= -75) return 3;
  if (rssi >= -85) return 2;
  return 1;
}

function renderNetwork(data){
  const ssid = document.getElementById("network-ssid");
  const details = document.getElementById("network-details");
  const status = document.getElementById("network-status");
  const bars = document.querySelectorAll("#signal-bars .bar");

  if (!data || data.error){
    ssid.textContent = "Sem ligação";
    status.textContent = "offline";
    details.innerHTML = `<li class="error-text">${data?.error || "sem dados"}</li>`;
    bars.forEach(b => b.classList.remove("on"));
    return;
  }

  const n = rssiToBars(data.rssi);
  bars.forEach((b, i) => b.classList.toggle("on", i < n));
  status.textContent = "ligado";
  ssid.textContent = data.ssid ? data.ssid.replace(/"/g, "") : "Desconhecido";
  details.innerHTML = `
    <li><span>Sinal</span><span>${data.rssi ?? "-"} dBm</span></li>
    <li><span>Veloc.</span><span>${data.link_speed_mbps ?? "-"} Mbps</span></li>
    <li><span>IP</span><span>${data.ip ?? "-"}</span></li>
  `;
}

function renderStorage(data){
  const ring = document.getElementById("storage-ring");
  const pctEl = document.getElementById("storage-percentage");
  const details = document.getElementById("storage-details");
  const status = document.getElementById("storage-status");

  if (!data || data.error){
    pctEl.textContent = "N/D";
    status.textContent = "erro";
    details.innerHTML = `<li class="error-text">${data?.error || "sem dados"}</li>`;
    setRing(ring, 0, true);
    return;
  }

  const usePercentStr = data["Use%"] || data["Capacity"] || "0%";
  const usePercent = parseInt(usePercentStr.replace("%", ""), 10) || 0;
  setRing(ring, usePercent, true);
  pctEl.textContent = `${usePercent}%`;
  status.textContent = usePercent > 85 ? "cheio" : "normal";
  details.innerHTML = `
    <li><span>Usado</span><span>${data.Used ?? "-"}</span></li>
    <li><span>Livre</span><span>${data.Avail ?? "-"}</span></li>
    <li><span>Total</span><span>${data.Size ?? "-"}</span></li>
  `;
}

async function refreshDashboard(){
  try {
    const res = await fetch("/api/all");
    const data = await res.json();
    renderBattery(data.battery);
    renderNetwork(data.network);
    renderStorage(data.storage);
    document.getElementById("last-update").textContent =
      "última sincronização " + new Date().toLocaleTimeString("pt-PT");
  } catch (err) {
    document.getElementById("last-update").textContent = "erro de ligação ao servidor";
  }
}

refreshDashboard();
setInterval(refreshDashboard, REFRESH_MS);
</script>
</body>
</html>

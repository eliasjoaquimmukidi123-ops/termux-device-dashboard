<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard do Telemóvel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>📱 Dashboard de Monitorização</h1>
    <p id="last-update">A carregar...</p>
  </header>

  <main class="grid">
    <section class="card" id="card-battery">
      <h2>🔋 Bateria</h2>
      <div class="battery-visual">
        <div class="battery-fill" id="battery-fill"></div>
      </div>
      <p class="big-number" id="battery-percentage">--%</p>
      <ul class="details" id="battery-details"></ul>
    </section>

    <section class="card" id="card-network">
      <h2>📶 Rede Wi-Fi</h2>
      <p class="big-number" id="network-ssid">--</p>
      <ul class="details" id="network-details"></ul>
    </section>

    <section class="card" id="card-storage">
      <h2>💾 Armazenamento</h2>
      <div class="storage-bar">
        <div class="storage-fill" id="storage-fill"></div>
      </div>
      <p class="big-number" id="storage-percentage">--%</p>
      <ul class="details" id="storage-details"></ul>
    </section>
  </main>

  <footer>
    <p>Actualiza automaticamente a cada 5 segundos · Corre localmente no seu telemóvel</p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
